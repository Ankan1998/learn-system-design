name: Deploy curriculum site

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.png"
      - "LICENSE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs toolchain
        run: pip install -r requirements-docs.txt

      # Fail fast on broken links, invalid Mermaid, stale counts, or metadata drift.
      - name: Verify curriculum content
        run: python scripts/verify.py

      - name: Check navigation footers are up to date
        run: python scripts/update_nav.py --check

      - name: Stage curriculum into docs/
        run: python scripts/build_docs.py

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
